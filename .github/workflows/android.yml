name: Build 128bit Music APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a GitHub Release

# One build at a time, so two pushes can't both claim the same version number.
concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Version numbers: v001, v002, ... one higher than the newest vNNN release. A build that
      # fails never publishes, so it doesn't use up a number.
      - name: Pick version number
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --limit 1000 --json tagName -q '.[].tagName' \
            | grep -E '^v[0-9]{3,}$' | sed 's/^v//' | sort -n | tail -1)
          next=$(( 10#${last:-0} + 1 ))
          name=$(printf 'v%03d' "$next")
          echo "Building $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION_NAME=$name" >> "$GITHUB_ENV"

      - name: Install Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      # The release key must be the same on every build, or Android refuses to install an
      # update over the app already on your phone. It lives in the RELEASE_KEYSTORE_BASE64
      # secret, never in the repo.
      - name: Restore release signing key
        id: key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            # Pasting on a phone can add spaces, line breaks or quotes; keep only base64 characters.
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' > keystore.b64
            echo "Secret has $(wc -c < keystore.b64) base64 characters (expected 3468)."
            if ! base64 -d keystore.b64 > keystore.jks 2>/dev/null \
              || ! keytool -list -keystore keystore.jks -storepass 128bitmusic -alias 128bit > /dev/null 2>&1; then
              echo "::error::RELEASE_KEYSTORE_BASE64 doesn't decode to the 128bit signing key. Re-paste the full contents of RELEASE_KEYSTORE_BASE64.txt into the secret."
              exit 1
            fi
            rm keystore.b64
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not set; building an unsigned-for-release debug APK only."
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=128bit Debug"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.key.outputs.signed == 'true'
        env:
          STORE_PASSWORD: 128bitmusic
          KEY_ALIAS: 128bit
          KEY_PASSWORD: 128bitmusic
        run: |
          ./gradlew --no-daemon :app:assembleUniversalFossRelease -x lint
          cp app/build/outputs/apk/universalFoss/release/*.apk "$GITHUB_WORKSPACE/128bitmusic${{ steps.ver.outputs.name }}.apk"

      - name: Build debug APK
        if: steps.key.outputs.signed != 'true'
        run: |
          ./gradlew --no-daemon :app:assembleUniversalFossDebug -x lint
          cp app/build/outputs/apk/universalFoss/debug/*.apk "$GITHUB_WORKSPACE/128bit-music-debug.apk"

      # Each build is its own release (tag vNNN) holding 128bitmusicvNNN.apk. The "app-latest"
      # release is refreshed too, so this fixed link always gets the newest build:
      # https://github.com/<owner>/<repo>/releases/download/app-latest/128bit-music.apk
      - name: Publish release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.name }}
        working-directory: ${{ github.workspace }}
        run: |
          apk="128bitmusic${VER}.apk"
          gh release create "$VER" "$apk" \
            --target "$GITHUB_SHA" \
            --title "128bit Music $VER" \
            --notes "128bit Music $VER, built from ${GITHUB_SHA::7}. Download $apk and tap it to install or update." \
            --latest
          cp "$apk" 128bit-music.apk
          gh release delete app-latest --cleanup-tag --yes || true
          gh release create app-latest "$apk" 128bit-music.apk \
            --target "$GITHUB_SHA" \
            --title "128bit Music (latest: $VER)" \
            --notes "Newest build: $VER. Download $apk (or 128bit-music.apk, same file) and tap it to install or update." \
            --latest=false

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed != 'true'
        with:
          name: 128bit-music-debug-apk
          path: 128bit-music-debug.apk
          if-no-files-found: error
