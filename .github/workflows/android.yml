name: Build 128bit Music APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      # Same signing key on every build lets the APK update in place instead of needing an
      # uninstall. Add a base64 keystore as the DEBUG_KEYSTORE_BASE64 secret to turn this on;
      # without it each run signs with a fresh throwaway key.
      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=128bit Debug"
          fi

      - name: Build universal FOSS debug APK
        run: ./gradlew --no-daemon :app:assembleUniversalFossDebug -x lint

      - uses: actions/upload-artifact@v4
        with:
          name: 128bit-music-debug-apk
          path: android/app/build/outputs/apk/universalFoss/debug/*.apk
          if-no-files-found: error
