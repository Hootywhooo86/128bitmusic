name: Build 128bit Music APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      # The release key must be the same on every build, or Android refuses to install an
      # update over the app already on your phone. It lives in the RELEASE_KEYSTORE_BASE64
      # secret, never in the repo.
      - name: Restore release signing key
        id: key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not set; building an unsigned-for-release debug APK only."
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=128bit Debug"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.key.outputs.signed == 'true'
        env:
          STORE_PASSWORD: 128bitmusic
          KEY_ALIAS: 128bit
          KEY_PASSWORD: 128bitmusic
        run: |
          ./gradlew --no-daemon :app:assembleUniversalFossRelease -x lint
          cp app/build/outputs/apk/universalFoss/release/*.apk "$GITHUB_WORKSPACE/128bit-music.apk"

      - name: Build debug APK
        if: steps.key.outputs.signed != 'true'
        run: |
          ./gradlew --no-daemon :app:assembleUniversalFossDebug -x lint
          cp app/build/outputs/apk/universalFoss/debug/*.apk "$GITHUB_WORKSPACE/128bit-music-debug.apk"

      # Fixed download link that always points at the newest build:
      # https://github.com/<owner>/<repo>/releases/download/app-latest/128bit-music.apk
      - name: Publish APK to the "app-latest" release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          gh release delete app-latest --cleanup-tag --yes || true
          gh release create app-latest 128bit-music.apk \
            --target "$GITHUB_SHA" \
            --title "128bit Music (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download 128bit-music.apk and tap it to install or update."

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.signed != 'true'
        with:
          name: 128bit-music-debug-apk
          path: 128bit-music-debug.apk
          if-no-files-found: error
